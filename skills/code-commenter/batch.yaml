skill: code-commenter
version: 1
extensions: default
exclude_patterns:
  mode: extend
  patterns: []
output_mode: edit-in-place
max_parallel: 5
discovery: scripts/discover_files.py
default_config:
  audience: senior
  style:
    python: google
    max_docstring_lines: 12
    include_examples: false
  omit_types_when_annotated: true
  idempotent: true
  batch_mode: true

# Optional — omit entirely for no verification (backward compatible).
# Uncomment and point gate_config at a real .comrades/verify.json to opt in.
# verify:
#   enabled: true
#   mode: per_file                      # per_file | checkpoint
#   checkpoint_every: 25                # only relevant when mode: checkpoint
#   gate_config: .comrades/verify.json  # path to gate config, relative to repo root
#   abort_threshold: 10                 # consecutive verify failures before halting the batch
